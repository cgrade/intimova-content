name: Publish due posts

on:
  schedule:
    # Every 10 minutes (:03, :13, ... :53) from 06:03 to 22:53 Lagos time (cron is in UTC).
    # GitHub delays or drops scheduled runs under load, especially at the top of the hour,
    # so we run often and off the hour. Runs are idempotent: nothing is posted twice.
    - cron: '3-59/10 5-21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: check everything, post nothing'
        type: boolean
        default: true
      only_post:
        description: 'Post id to publish now, ignoring its time (leave empty for the normal schedule)'
        type: string
        default: ''

permissions:
  contents: write
  issues: write

concurrency:
  group: publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          ONLY_POST: ${{ inputs.only_post }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          META_IG_TOKEN: ${{ secrets.META_IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TOKENS_KEY: ${{ secrets.TOKENS_KEY }}
          PLATFORMS: ${{ vars.PLATFORMS || 'instagram,facebook' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTIFY_USER: ${{ github.repository_owner }}
        run: node publisher/publish.mjs
      - name: Save what was posted
        if: always()
        run: |
          git config user.name "intimova-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if ! git diff --cached --quiet; then
            git commit -m "Publisher: record posts [skip ci]"
            # If someone pushed to main while this ran, rebase onto it and retry.
            # Losing this record could make the next run post the same thing again.
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              git rebase --abort 2>/dev/null || true
              echo "Push failed, retrying ($i)"; sleep $((i * 5))
            done
            echo "::error::Could not save state/posted.json. Check before the next run, or a post may repeat."
            exit 1
          fi
