<!doctype html>
<html><head><meta charset="utf-8">
<!-- Text layer of an Intimova story reel. The story is injected as window.STORY before this page runs. -->
<style>
@font-face{font-family:'PF';src:url('../../node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-normal.woff2');font-weight:400;font-style:normal}
@font-face{font-family:'PF';src:url('../../node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-italic.woff2');font-weight:400;font-style:italic}
@font-face{font-family:'PF';src:url('../../node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2');font-weight:700;font-style:normal}
@font-face{font-family:'IN';src:url('../../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2');font-weight:400}
@font-face{font-family:'IN';src:url('../../node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2');font-weight:600}
html,body{margin:0;background:transparent}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'PF',serif;color:#faf3ec}
#scrim{position:absolute;inset:0;background:radial-gradient(ellipse 78% 46% at 42% 47%, rgba(6,1,4,.78) 0%, rgba(6,1,4,.55) 45%, rgba(6,1,4,0) 100%),linear-gradient(180deg, rgba(6,1,4,.45) 0%, rgba(6,1,4,0) 22%)}
.label{position:absolute;left:120px;top:262px;font-family:'IN',sans-serif;font-weight:600;font-size:24px;letter-spacing:6px;color:#d8c3c0;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.scene{position:absolute;left:120px;width:720px;top:252px;height:1490px;display:flex;flex-direction:column;justify-content:center;gap:34px}
.line{font-size:66px;line-height:1.22;text-shadow:0 2px 30px rgba(0,0,0,.8),0 0 3px rgba(0,0,0,.5)}
.line.hook{font-size:104px;line-height:1.1}
.line.sub{font-size:52px;font-style:italic;color:#e9c9bd}
.line.big{font-size:150px;line-height:1}
.line.punch{font-size:84px;line-height:1.12}
.w{display:inline-block;will-change:transform,opacity,filter;white-space:pre}
.em{font-style:italic;color:#ecbfb4}
.end .brand{font-weight:700;font-size:128px;line-height:1;color:#faf3ec}
.end .rule{width:84px;height:3px;background:#c0605a;margin:8px 0 4px}
.end .small{font-family:'IN',sans-serif;font-weight:600;font-size:26px;letter-spacing:6px;color:#d8c3c0}
.end .part{font-size:58px;font-style:italic;color:#ecbfb4;line-height:1.2}
</style></head>
<body><div id="stage"><div id="scrim"></div><div class="label" id="label"></div></div>
<script>
const STORY = window.STORY;
// "*text*" marks emphasis (rose italic). Returns [[text, isEm], ...].
function runsOf(text) {
  const out = []; let em = false;
  for (const part of text.split('*')) { if (part) out.push([part, em]); em = !em; }
  return out;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Timing. Defaults match the approved Lily reel; auto-scaled down if the story runs past max_seconds.
const BASE = {WORD: 0.15, WDUR: 0.75, LINE_GAP: 0.26, HOLD: 1.0, HOLD_PER_WORD: 0.025, HOLD_MAX: 2.4, EXIT: 0.55, LEAD: 0.2, END_LEN: STORY.end_seconds || 3.0, SLOW_DUR: 1.3};
const MAX = STORY.max_seconds || 179.5;   // Instagram shows Reels of up to 3 minutes in the Reels tab

function plan(k) {
  const P = {...BASE, WORD: BASE.WORD * k, LINE_GAP: BASE.LINE_GAP * k, HOLD: BASE.HOLD * k, HOLD_PER_WORD: BASE.HOLD_PER_WORD * k};
  const scenes = []; const cues = {}; let t = 0.35;
  for (const sc of STORY.scenes) {
    const s = {t0: t, lines: []}; let cur = t + P.LEAD; let nw = 0;
    if (sc.cue) cues[sc.cue] = t;
    for (const ln of sc.lines) {
      if (ln.cue) cues[ln.cue] = cur;
      const L = {style: ln.style || '', slow: !!ln.slow, words: []}; let last = cur;
      for (const [txt, em] of runsOf(ln.text)) {
        for (const p of txt.split(/(\s+)/).filter(x => x.length)) {
          if (/^\s+$/.test(p)) { L.words.push({space: true}); continue; }
          L.words.push({text: p, em, t: cur, dur: L.slow ? P.SLOW_DUR : P.WDUR}); last = cur; cur += P.WORD; nw++;
        }
      }
      s.lines.push(L);
      cur = last + P.WDUR * 0.5 + P.LINE_GAP + (L.slow ? 0.4 : 0);
    }
    s.t1 = cur - P.LINE_GAP + Math.min(P.HOLD + P.HOLD_PER_WORD * nw, P.HOLD_MAX);
    scenes.push(s); t = s.t1 + P.EXIT + 0.15;
  }
  return {P, scenes, cues, endT0: t, total: t + P.END_LEN};
}
let k = 1, T = plan(1);
const TARGET = MAX - 0.3;
for (let i = 0; i < 12 && T.total > TARGET && k > 0.62; i++) { k *= Math.max(0.9, (TARGET - 4) / (T.total - 4)); T = plan(k); }
window.TOTAL = T.total; window.SCALE = k; window.FITS = T.total <= MAX;
window.CUES = {...T.cues, end: T.endT0, total: T.total};
window.SCENE_T1 = T.scenes.map(s => s.t1);

// Build DOM
const stage = document.getElementById('stage');
document.getElementById('label').textContent = STORY.label || '';
const wordEls = [];
for (const s of T.scenes) {
  const el = document.createElement('div'); el.className = 'scene'; stage.appendChild(el); s.el = el;
  for (const L of s.lines) {
    const le = document.createElement('div'); le.className = 'line ' + L.style; el.appendChild(le);
    for (const w of L.words) {
      if (w.space) { le.appendChild(document.createTextNode(' ')); continue; }
      const sp = document.createElement('span'); sp.className = 'w' + (w.em ? ' em' : ''); sp.textContent = w.text; le.appendChild(sp);
      wordEls.push({el: sp, t: w.t, dur: w.dur, slow: L.slow});
    }
  }
}
const E = STORY.end || {};
const end = document.createElement('div'); end.className = 'scene end';
end.innerHTML = (E.kicker ? `<div class="small">${esc(E.kicker)}</div>` : '') + (E.line ? `<div class="part">${esc(E.line)}</div>` : '') +
  `<div class="rule"></div><div class="brand">${esc(E.brand || 'Intimova')}</div><div class="small">${esc(E.url || 'INTIMOVA.NG')}</div>`;
stage.appendChild(end);

const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3);
const clamp = x => Math.min(Math.max(x, 0), 1);
window.render = (time) => {
  for (const w of wordEls) {
    const p = ease((time - w.t) / w.dur);
    w.el.style.opacity = p.toFixed(3);
    const dy = (1 - p) * (w.slow ? 10 : 18), sc = w.slow ? 0.94 + 0.06 * p : 1;
    w.el.style.transform = `translateY(${dy.toFixed(2)}px) scale(${sc.toFixed(4)})`;
    w.el.style.filter = `blur(${((1 - p) * 10).toFixed(2)}px)`;
  }
  for (const s of T.scenes) {
    const out = clamp((time - s.t1) / T.P.EXIT);
    s.el.style.opacity = (1 - out).toFixed(3);
    s.el.style.filter = out > 0 ? `blur(${(out * 12).toFixed(2)}px)` : 'none';
    s.el.style.display = time < s.t0 - 0.05 || out >= 1 ? 'none' : 'flex';
  }
  const ep = ease((time - T.endT0 - 0.1) / 1.0);
  end.style.opacity = ep.toFixed(3); end.style.transform = `translateY(${((1 - ep) * 16).toFixed(2)}px)`;
  end.style.display = time < T.endT0 ? 'none' : 'flex';
  const lab = document.getElementById('label');
  lab.style.opacity = (ease((time - 0.2) / 0.9) * (1 - clamp((time - (T.endT0 - 0.6)) / 0.6))).toFixed(3);
};
window.render(0);
</script></body></html>
